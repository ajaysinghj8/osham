<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified Osham architecture illustrating cache flow and pooling -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Osham architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      .box { fill:#fff; stroke:#333; stroke-width:1.5; rx:8; ry:8 }
      .label { font-family: Helvetica, Arial, sans-serif; font-size:14px; fill:#111 }
      .sub { font-size:12px; fill:#555 }
      .arrow { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow) }
      .pool { stroke:#d95f02; }
      .hit { stroke:#2ca02c; }
      .miss { stroke:#d62728; }
    </style>
  </defs>

  <!-- Client -->
  <g transform="translate(40,120)">
    <rect class="box" width="160" height="120"/>
    <text x="80" y="30" class="label" text-anchor="middle">Client</text>
    <text x="80" y="55" class="sub" text-anchor="middle">(consumer)</text>
    <!-- multiple requests -->
    <path class="arrow pool" d="M160,30 L260,30" />
    <path class="arrow pool" d="M160,50 L260,50" />
    <path class="arrow pool" d="M160,70 L260,70" />
    <text x="210" y="20" class="sub" text-anchor="middle">concurrent</text>
  </g>

  <!-- Osham -->
  <g transform="translate(260,60)">
    <rect class="box" width="200" height="200"/>
    <text x="100" y="30" class="label" text-anchor="middle">Osham</text>
    <text x="100" y="50" class="sub" text-anchor="middle">proxy cache &amp; pooling</text>
    <!-- internal cache depiction -->
    <rect x="50" y="80" width="100" height="60" fill="#f0f0f0" stroke="#666" rx="5" ry="5"/>
    <text x="100" y="110" class="sub" text-anchor="middle">Cache store</text>
    <!-- flow labels inside osham -->
    <text x="100" y="150" class="sub" text-anchor="middle">miss → backend</text>
    <text x="100" y="170" class="sub" text-anchor="middle">hold followers</text>
    <text x="100" y="190" class="sub" text-anchor="middle">hit → respond</text>
  </g>

  <!-- Backend -->
  <g transform="translate(620,120)">
    <rect class="box" width="160" height="120"/>
    <text x="80" y="30" class="label" text-anchor="middle">Backend</text>
    <text x="80" y="55" class="sub" text-anchor="middle">origin\nservice</text>
  </g>

  <!-- Miss / Forward -->
  <path class="arrow miss" d="M460,120 L620,120" />
  <text x="540" y="110" class="sub" text-anchor="middle">cache miss → forward</text>

  <!-- Backend response -->
  <path class="arrow miss" d="M620,180 L460,180" />
  <text x="540" y="190" class="sub" text-anchor="middle">response</text>

  <!-- Hit direct reply -->
  <path class="arrow hit" d="M460,240 L260,240" />
  <text x="360" y="230" class="sub" text-anchor="middle">cache hit</text>

  <!-- Followers receive same response -->
  <path class="arrow pool" d="M260,80 L160,80" />
  <text x="210" y="70" class="sub" text-anchor="middle">pooled replies</text>

</svg>
